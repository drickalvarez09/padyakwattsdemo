<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>PADYAKWATTS - User Dashboard</title>
    <link rel="stylesheet" href="./css/tailwind.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <link rel="stylesheet" href="./css/dashboard.css"/>
</head>
<body class="text-gray-800">
    <!-- Loading Indicator -->
    <div id="loading" class="loading-indicator">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-4"></div>
            <p class="text-green-600 font-semibold">Loading...</p>
        </div>
    </div>

    <!-- Toasts -->
    <div id="toast-container" class="fixed top-4 right-4 z-[10000] flex flex-col gap-3 items-end"></div>

    <!-- Mobile Navbar -->
    <header class="md:hidden flex justify-between items-center p-4 bg-green-600 text-white shadow-lg">
        <button id="menu-toggle" class="text-white focus:outline-none">
            <i class="fas fa-bars text-2xl"></i>
        </button>
        <h1 class="text-xl font-bold">PADYAKWATTS</h1>
        <div class="w-8"></div>
    </header>

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar text-white min-w-[17rem] max-w-[22rem] min-h-screen fixed md:static top-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-40 flex flex-col">
            <!-- Logo Section -->
            <div class="flex items-center space-x-3 px-6 py-6 border-b border-green-500/30">
                <div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
                    <i class="fas fa-bolt text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-semibold">PADYAKWATTS</h1>
                    <p class="text-xs text-white/70">Dashboard</p>
                </div>
            </div>

            <!-- Demo banner -->
            <div id="demo-banner" class="hidden mx-4 mt-4 px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-xs leading-snug">
                <i class="fas fa-info-circle mr-1"></i>
                You're viewing a live demo account — feel free to click around.
            </div>

            <!-- User Info -->
            <div class="px-6 py-4 border-b border-green-500/30">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div>
                        <p class="font-semibold" id="sidebar-user-name">User</p>
                        <p class="text-xs text-white/70" id="sidebar-user-points">0 Points</p>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex flex-col space-y-2 px-4 py-6">
                <a href="#energy" data-tab="energy" class="tab-btn flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-bolt w-5 text-center"></i>
                    <span>My Energy Stats</span>
                </a>

                <a href="#report" data-tab="report" class="tab-btn flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-exclamation-triangle w-5 text-center"></i>
                    <span>Report a Problem</span>
                </a>

                <a href="#profile" data-tab="profile" class="tab-btn flex items-center space-x-3 px-4 py-3 rounded-lg">
                    <i class="fas fa-user w-5 text-center"></i>
                    <span>Profile Settings</span>
                </a>

                <div class="pt-4 mt-4 border-t border-green-500/30">
                    <a href="#" id="logout-link" class="tab-btn flex items-center space-x-3 px-4 py-3 rounded-lg text-white/80 hover:text-white">
                        <i class="fas fa-sign-out-alt w-5 text-center"></i>
                        <span>Log Out</span>
                    </a>
                </div>
            </nav>

            <!-- Footer Stats -->
            <div class="mt-auto px-6 py-4 border-t border-green-500/30">
                <div class="text-center">
                    <div class="flex justify-between items-center text-sm mb-2">
                        <span class="text-white/70">Today's Energy</span>
                        <span class="font-semibold"><span id="sidebar-today-energy">0.0</span> Wh</span>
                    </div>
                    <div class="h-2 bg-white/20 rounded-full overflow-hidden">
                        <div class="h-full bg-white/40 rounded-full transition-all duration-700" id="sidebar-today-bar" style="width: 0%"></div>
                    </div>
                    <p class="text-xs text-white/60 mt-3">
                        <i class="fas fa-leaf mr-1"></i>
                        <span id="sidebar-co2">0</span>g CO₂ saved today
                    </p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 md:p-6">
            <!-- Tab Content Area -->
            <div id="tab-content" class="dashboard-container bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl p-6 md:p-8 min-h-[calc(100vh-2rem)] border border-green-100 fade-in">
                <!-- injected by dashboard.js -->
            </div>
        </main>
    </div>

    <script src="./js/data.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
