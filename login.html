<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>PADYAKWATTS - Login</title>
    <link rel="stylesheet" href="./css/tailwind.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <link rel="stylesheet" href="./css/login.css"/>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 100%);
            min-height: 100vh;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #10B981, #0D9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .energy-orb {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #10B981, #0D9488);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            animation: float 4s ease-in-out infinite;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }
        
        .energy-orb::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.8), transparent);
            border-radius: 50%;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Logo with Animation -->
    <div class="text-center mb-8 animate-fadeIn">
        <div class="energy-orb mb-6">
            <i class="fas fa-bolt text-white text-4xl absolute inset-0 flex items-center justify-center z-10"></i>
        </div>
        <h1 class="text-4xl font-bold gradient-text mb-2">PADYAKWATTS</h1>
        <p class="text-gray-600">Pedal-Powered Clean Energy</p>
    </div>
    
    <!-- Login Card -->
    <div class="login-container card w-full max-w-md p-8 animate-slideIn">
        <h2 class="text-2xl font-bold text-center mb-8">Welcome Back</h2>

        <div id="error-box" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg hidden">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                <p class="text-red-700 font-medium" id="error-text"></p>
            </div>
        </div>

        <!-- Demo account hint -->
        <button type="button" id="demo-login-btn" class="w-full mb-6 flex items-center justify-between p-4 bg-green-50 border border-green-200 rounded-lg hover:bg-green-100 transition-colors text-left">
            <span class="flex items-center">
                <i class="fas fa-magic text-green-600 mr-3"></i>
                <span>
                    <span class="block text-sm font-semibold text-green-800">Try the demo account</span>
                    <span class="block text-xs text-green-700">No signup needed — see a populated dashboard instantly</span>
                </span>
            </span>
            <i class="fas fa-arrow-right text-green-600"></i>
        </button>

         <div class="mb-6">
            <a href="javascript:history.back()" class="inline-flex items-center text-green-600 hover:text-green-800 font-medium transition-colors duration-200">
                <i class="fas fa-arrow-left mr-2"></i>
                Back
            </a>
        </div>
        <form id="login-form" class="space-y-6">
    <div class="form-group">
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="email">
            <i class="fas fa-envelope mr-2 text-green-600"></i>Email Address
        </label>
        <input class="enhanced-input w-full" id="email" name="email" placeholder="you@example.com" required type="email"/>
    </div>
    
    <div class="form-group">
        <label class="block text-sm font-semibold text-gray-700 mb-2" for="password">
            <i class="fas fa-lock mr-2 text-green-600"></i>Password
        </label>
        <div class="relative">
            <input class="enhanced-input w-full pr-12" id="password" name="password" placeholder="Enter your password" required type="password"/>
            <button type="button" class="password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye"></i>
            </button>
        </div>
    </div>
    
    <div class="flex items-center justify-between">
        <label class="enhanced-checkbox">
            <input type="checkbox" name="remember">
            <span class="checkmark"></span>
            <span class="text-gray-700 text-sm ml-2">Remember me</span>
        </label>
        <a href="forgot-password.html" class="enhanced-link text-sm">
            Forgot password?
        </a>
    </div>
    
    <button type="submit" class="enhanced-submit w-full" id="submit-btn">
        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
    </button>
</form>
        
        <div class="mt-8 pt-8 border-t border-gray-100 text-center">
            <p class="text-gray-600 mb-4">Don't have an account?</p>
            <a href="./signup.html" class="inline-block w-full py-3 border-2 border-green-600 text-green-600 font-semibold rounded-lg hover:bg-green-50 transition-colors">
                <i class="fas fa-user-plus mr-2"></i>Create Account
            </a>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="mt-12 text-center text-gray-500 text-sm">
        <p class="mb-2">© 2024 PADYAKWATTS. Powering communities with clean energy.</p>
        <p class="text-xs text-gray-400">Front-end portfolio demo — no real accounts or data leave your browser.</p>
    </footer>
    
    <script src="./js/data.js"></script>
    <script>
        // If already "logged in", skip straight to the dashboard.
        if (window.PWData.getCurrentUser()) {
            window.location.href = 'dashboard.html';
        }

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = event.currentTarget.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        document.getElementById('demo-login-btn').addEventListener('click', function () {
            document.getElementById('email').value = window.PWData.DEMO_EMAIL;
            document.getElementById('password').value = window.PWData.DEMO_PASSWORD;
            document.getElementById('login-form').requestSubmit();
        });

        function showFormError(message) {
            const box = document.getElementById('error-box');
            document.getElementById('error-text').textContent = message;
            box.classList.remove('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            document.getElementById('error-box').classList.add('hidden');

            if (!email || !password) {
                showFormError('Please fill in all required fields.');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing In...';

            setTimeout(() => {
                const result = window.PWData.login(email, password);
                if (result.ok) {
                    window.location.href = 'dashboard.html';
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Sign In';
                    showFormError(result.error);
                }
            }, 350);
        });

        // Add animation to form elements on load
        document.querySelectorAll('input').forEach((input, index) => {
            input.style.opacity = '0';
            input.style.transform = 'translateY(10px)';
            setTimeout(() => {
                input.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                input.style.opacity = '1';
                input.style.transform = 'translateY(0)';
            }, index * 100);
        });
    </script>
</body>
</html>
