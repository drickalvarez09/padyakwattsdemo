<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>PADYAKWATTS - Forgot Password</title>
    <link rel="stylesheet" href="./css/tailwind.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 100%);
            min-height: 100vh;
        }

        .forgot-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #10B981, #0D9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-green-400 to-teal-400 flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-bolt text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold gradient-text mb-2">PADYAKWATTS</h1>
        <p class="text-gray-600">Reset Your Password</p>
    </div>

    <!-- Forgot Password Card -->
    <div class="forgot-container card w-full max-w-md p-8">
        <h2 class="text-2xl font-bold text-center mb-6">Forgot Password?</h2>
        <p class="text-gray-600 text-center mb-8">
            Enter your email address and we'll send you instructions to reset your password.
        </p>

        <div id="error-box" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg hidden">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
                <p class="text-red-700 font-medium" id="error-text"></p>
            </div>
        </div>

        <div id="success-box" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 rounded-r-lg hidden">
            <div class="flex items-center">
                <i class="fas fa-check-circle text-green-500 mr-3"></i>
                <p class="text-green-700 font-medium" id="success-text"></p>
            </div>
        </div>

        <form id="forgot-form" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2" for="email">
                    <i class="fas fa-envelope mr-2 text-green-600"></i>Email Address
                </label>
                <input class="input-modern w-full" id="email" name="email" placeholder="you@example.com" required type="email"/>
            </div>

            <button type="submit" class="btn-modern w-full text-lg py-4" id="submit-btn">
                <i class="fas fa-paper-plane mr-2"></i>Send Reset Instructions
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-gray-100 text-center">
            <a href="./login.html" class="text-green-600 hover:text-green-800 font-semibold transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back to Login
            </a>
        </div>
    </div>

    <p class="mt-8 text-xs text-gray-400 text-center max-w-sm">
        This is a portfolio demo, so no email is actually sent — this form simply mirrors the
        original app's flow and messaging.
    </p>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const errorBox = document.getElementById('error-box');
            const successBox = document.getElementById('success-box');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            if (!email) {
                document.getElementById('error-text').textContent = 'Please enter your email address.';
                errorBox.classList.remove('hidden');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('error-text').textContent = 'Please enter a valid email address.';
                errorBox.classList.remove('hidden');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sending...';

            setTimeout(() => {
                document.getElementById('success-text').textContent =
                    'If your email exists in our system, you will receive password reset instructions.';
                successBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Send Reset Instructions';
            }, 600);
        });
    </script>
</body>
</html>
